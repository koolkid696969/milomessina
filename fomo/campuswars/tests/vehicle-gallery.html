<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Village vehicle visual check</title><style>@font-face{font-family:Aeonik;src:url(../assets/aeonik-700.ttf);font-weight:700}body{margin:0;background:#98a7ba;font:14px Arial;color:white}nav{position:fixed;top:20px;left:20px;z-index:2;display:flex;gap:8px}button{border:1px solid #ffffff55;background:#182435;color:white;padding:12px;border-radius:8px;cursor:pointer}output{position:fixed;bottom:20px;left:20px;background:#182435;padding:12px;border-radius:8px}</style><nav><button data-model="sedan">Sedan</button><button data-model="crossover">Crossover</button><button data-model="shuttle">Shuttle</button><button id="rear">Other side</button><button id="brand">Toggle fomo</button></nav><output id="stats"></output><script type="module">
import * as T from '../vendor/three.module.min.js';import {createVehicleKit} from '../village-vehicles.js?v=35';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x98a7ba);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(7,4.3,8);camera.lookAt(0,.85,0);
scene.add(new T.HemisphereLight(0xd4e2ed,0x857768,2));const sun=new T.DirectionalLight(0xffedda,3);sun.position.set(-4,10,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new T.DirectionalLight(0xc4d2e0,1);fill.position.set(7,4,-5);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x78858d,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=.045;floor.receiveShadow=true;scene.add(floor);
const kit=createVehicleKit(T);let car,style='sedan',branded=true,turn=0;
function draw(){if(car)scene.remove(car.group);car=kit.create(scene,{style,color:0xe8eceb,branded});car.group.rotation.y=turn;renderer.render(scene,camera);document.getElementById('stats').textContent=`${style} · ${renderer.info.render.triangles.toLocaleString()} triangles`;}draw();
for(const b of document.querySelectorAll('[data-model]'))b.onclick=()=>{style=b.dataset.model;draw();};document.getElementById('rear').onclick=()=>{turn+=Math.PI;draw();};document.getElementById('brand').onclick=()=>{branded=!branded;draw();};document.addEventListener('village:artwork',draw);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
</script></html>
